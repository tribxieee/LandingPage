<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naura Innova - Header Navbar</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- navbar -->
    <header class="navbar-header">
      <nav class="navbar">
        <a href="#" class="nav-logo">
          <img
            src="assets/img/navbar/logo-navbar.png"
            alt="Naura Innova Logo"
          />
        </a>

        <ul class="nav-menu">
          <li class="nav-item">
            <a href="#about" class="nav-link">About Us</a>
          </li>
          <li class="nav-item">
            <a href="#services" class="nav-link">Services</a>
          </li>
          <li class="nav-item">
            <a href="#portofolio" class="nav-link">Portofolio</a>
          </li>
          <li class="nav-item mobile-only">
            <a href="#contact" class="btn-contact">Contact Us &rarr;</a>
          </li>
        </ul>

        <div class="nav-cta desktop-only">
          <a href="#contact" class="btn-contact">Contact Us &rarr;</a>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </nav>
    </header>
    <!-- end navbar -->

    <!-- hero -->
    <section class="hero-section">
      <div class="hero-container">
        <!-- Hero Left Content -->
        <div class="hero-content">
          <h1 class="hero-title">DIGITAL INNOVATION PARTNER</h1>
          <h2 class="hero-subtitle">
            Transform Your Business With Next-Gen Solutions
          </h2>
          <p class="hero-description">
            Kami membantu perusahaan dan UMKM memodernisasi infrastruktur
            digital mereka dengan teknologi terkini.
          </p>

          <div class="hero-buttons">
            <a href="#get-started" class="btn-primary">Get Started &rarr;</a>
            <a href="#learn-more" class="btn-secondary">Learn More</a>
          </div>
        </div>

        <!-- Hero Right Image -->
        <div class="hero-image">
          <img
            src="assets/img/hero/image-hero.jpg"
            alt="Digital Innovation Partner Workspace"
          />
        </div>
      </div>
    </section>
    <!-- end hero -->

    <script src="assets/js/script.js"></script>
  </body>
</html>
